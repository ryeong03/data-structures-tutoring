<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>자료구조 튜터링 퀴즈 업로드 템플릿</title></head>
<body>
  <h1>자료구조 튜터링 퀴즈 템플릿</h1>
  <p>아래 quiz-data의 질문, 보기 4개, 정답 번호(0~3), 해설을 수정한 뒤 이 HTML 파일을 사이트에 올리세요. 화면은 사이트의 공통 퀴즈 디자인으로 표시됩니다.</p>
  <script id="quiz-data" type="application/json">
  [
    {"question":"포인터가 저장하는 것은 무엇인가요?","choices":["메모리 주소","자료형 이름","함수의 실행 시간","배열의 길이"],"answer":0,"explanation":"포인터 변수는 다른 값이 놓인 메모리 주소를 저장합니다."},
    {"question":"연결 리스트의 맨 앞에 노드를 추가할 때, head가 있다면 일반적으로 필요한 시간은?","choices":["O(1)","O(log n)","O(n)","O(n²)"],"answer":0,"explanation":"기존 head를 새 노드의 next에 연결하고 head를 바꾸면 됩니다."},
    {"question":"스택에서 가장 나중에 넣은 원소가 가장 먼저 나오는 성질은?","choices":["FIFO","LIFO","정렬 불변식","해시 충돌"],"answer":1,"explanation":"스택은 Last In, First Out 구조입니다."},
    {"question":"BST에 1, 2, 3, 4, 5를 순서대로 삽입하면 최악의 탐색 시간은?","choices":["O(1)","O(log n)","O(n)","O(n log n)"],"answer":2,"explanation":"한쪽으로 치우친 사슬이 되어 최대 n개의 노드를 방문합니다."},
    {"question":"BFS에서 다음 방문 노드를 관리하는 자료구조는?","choices":["스택","큐","힙","해시 테이블"],"answer":1,"explanation":"먼저 발견한 노드를 먼저 방문하므로 큐를 사용합니다."}
  ]
  </script>
